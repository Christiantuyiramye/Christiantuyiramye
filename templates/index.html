<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Face Attendance</title>
<link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<header>
  <h1>Face Attendance</h1>
  <nav>
    <button data-tab="recognize" class="active">Recognize</button>
    <button data-tab="employees">Employees</button>
    <button data-tab="attendance">Attendance</button>
    <button data-tab="stats">Stats</button>
    <button data-tab="leave">Leave</button>
    <button data-tab="holidays">Holidays</button>
  </nav>
</header>

<main>
  <section id="tab-recognize" class="tab active">
    <div class="camera-wrap">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>
    <div class="controls">
      <button id="startCam">Start camera</button>
      <button id="capture">Recognize face</button>
      <label><input type="checkbox" id="autoLoop"> Auto every 3s</label>
    </div>
    <ul id="recognizeResults" class="results"></ul>
  </section>

  <section id="tab-employees" class="tab">
    <form id="empForm">
      <input name="name" placeholder="Full name" required>
      <input name="employee_id" placeholder="Employee ID" required>
      <input name="department" placeholder="Department">
      <input name="role" placeholder="Role">
      <input name="email" placeholder="Email">
      <input name="phone" placeholder="Phone">
      <button type="submit">Add Employee</button>
    </form>
    <div id="empRegisterFace" class="hidden">
      <h3>Register face for <span id="empRegName"></span></h3>
      <video id="regVideo" autoplay muted playsinline></video>
      <button id="regCapture">Capture & save</button>
      <button id="regCancel">Cancel</button>
    </div>
    <table id="empTable">
      <thead><tr><th>Name</th><th>ID</th><th>Dept</th><th>Role</th><th>Face</th><th>Active</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-attendance" class="tab">
    <div class="filters">
      <input type="date" id="attDate">
      <input type="text" id="attDept" placeholder="Department">
      <select id="attStatus">
        <option value="">Any status</option>
        <option>present</option><option>late</option><option>absent</option><option>holiday</option>
      </select>
      <button id="attLoad">Load</button>
      <button id="attExportCsv">Export CSV</button>
    </div>
    <table id="attTable">
      <thead><tr><th>Date</th><th>Employee</th><th>Dept</th><th>In</th><th>Out</th><th>Hours</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-stats" class="tab">
    <input type="date" id="statsDate">
    <button id="statsLoad">Load</button>
    <div id="statsBox" class="cards"></div>
    <h3>Monthly</h3>
    <input type="number" id="statsYear" placeholder="Year">
    <input type="number" id="statsMonth" placeholder="Month" min="1" max="12">
    <button id="statsMonthLoad">Load month</button>
    <table id="monthTable">
      <thead><tr><th>Date</th><th>Present</th><th>Late</th><th>Absent</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-leave" class="tab">
    <form id="leaveForm">
      <input name="employee_id" type="number" placeholder="Employee numeric ID" required>
      <select name="leave_type"><option>sick</option><option>annual</option><option>emergency</option></select>
      <input name="start_date" type="date" required>
      <input name="end_date" type="date" required>
      <input name="reason" placeholder="Reason">
      <button type="submit">Submit</button>
    </form>
    <table id="leaveTable">
      <thead><tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Reason</th><th>Status</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="tab-holidays" class="tab">
    <form id="holForm">
      <input name="name" placeholder="Name" required>
      <input name="date" type="date" required>
      <input name="description" placeholder="Description">
      <button type="submit">Add</button>
    </form>
    <table id="holTable">
      <thead><tr><th>Date</th><th>Name</th><th>Description</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </section>
</main>

<div id="toast"></div>
<script src="/static/js/app.js"></script>
</body>
</html>
