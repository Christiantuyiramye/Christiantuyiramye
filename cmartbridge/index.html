<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f2f0ea" />
    <meta
      name="description"
      content="CmartBridge Rwanda — order Korean skincare, K-pop merch, phone & fashion accessories from Korea, delivered to your door in Kigali. One all-in price, pay with MTN MoMo or Airtel Money."
    />
    <title>CmartBridge Rwanda — Korea to Kigali, one all-in price</title>
    <!-- Runs before first paint so a dark-mode visitor never sees a white flash.
         A saved choice wins; otherwise follow the device setting. -->
    <script>
      ;(function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('cmart-theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {}
        document.documentElement.dataset.theme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#0a0a0a' : '#f2f0ea')
      })()
    </script>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <!-- Satoshi (free, from Fontshare). The italic is a separate request so that
         if it ever fails, the main weights still load and the browser slants them. -->
    <link
      href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap"
      rel="stylesheet"
    />
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@401&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
