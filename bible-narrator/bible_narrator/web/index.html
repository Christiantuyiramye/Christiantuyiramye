<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Narrator</title>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand" aria-label="Bible Narrator">Bible Narrator<span class="dot">.</span></div>
      <form class="search" id="global-search" role="search">
        <span class="icon" data-icon="search"></span>
        <input id="global-search-input" type="search" placeholder="Type a passage (John 3:16) or search your library…" aria-label="Passage or search" autocomplete="off">
      </form>
      <div class="top-actions">
        <button class="status-pill" id="pill-offline" title="Privacy and network status"><span class="led ok"></span><span>Offline</span></button>
        <button class="status-pill" id="pill-model" title="Language model status"><span class="led"></span><span>Model</span></button>
        <button class="status-pill" id="pill-voice" title="Voice status"><span class="led"></span><span>Voices</span></button>
        <button class="btn ghost icon-only" id="theme-toggle" title="Switch light / black mode" aria-label="Switch light or black mode"><span data-icon="moon"></span></button>
      </div>
    </header>
    <nav class="nav" id="nav" aria-label="Main">
      <button data-view="home"><span data-icon="home"></span>Home</button>
      <button data-view="read"><span data-icon="book"></span>Read Scripture</button>
      <button data-view="story"><span data-icon="film"></span>Retell a passage</button>
      <button data-view="ask"><span data-icon="chat"></span>Ask a question</button>
      <button data-view="library"><span data-icon="library"></span>Library</button>
      <button data-view="voices"><span data-icon="voice"></span>Voices</button>
      <button data-view="settings"><span data-icon="settings"></span>Settings</button>
    </nav>
    <main class="main" id="main" tabindex="-1"></main>
    <section class="player idle" id="player" aria-label="Audio player"></section>
  </div>
  <div class="toast-wrap" id="toasts" aria-live="polite"></div>
</body>
</html>
